<style>
:root{
  --bg:#F3F5F0; --card:#FFFFFF; --ink:#1B241D; --muted:#667268; --faint:#98A39A; --line:#E1E6DE; --fill:#EAEFE7;
  --green:#2E6A47; --green-soft:#DDEBE0; --amber:#946A10; --amber-soft:#F4EAD0; --rose:#A8325F; --rose-soft:#F6E2EA;
  --display:"Cormorant Garamond", Georgia, serif;
  --body:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#101511; --card:#1A211C; --ink:#E8EDE7; --muted:#9DA99F; --faint:#6E7A70; --line:#2A332C; --fill:#232C25;
    --green:#7FC69C; --green-soft:#21362A; --amber:#E2BA60; --amber-soft:#382F1C; --rose:#EA8FB2; --rose-soft:#3A2230;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101511; --card:#1A211C; --ink:#E8EDE7; --muted:#9DA99F; --faint:#6E7A70; --line:#2A332C; --fill:#232C25;
  --green:#7FC69C; --green-soft:#21362A; --amber:#E2BA60; --amber-soft:#382F1C; --rose:#EA8FB2; --rose-soft:#3A2230;}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;overscroll-behavior-y:none}
img{max-width:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(100px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.app{max-width:640px}}
.lat{font-family:var(--display);font-style:italic;font-size:1.14em;letter-spacing:.005em}
.cv{font-family:var(--display);font-size:1.14em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,textarea,select{font-size:16px}
input{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:12px 14px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.topbar h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{padding:9px;border-radius:10px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:12px}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
/* hero */
.hero{text-align:center;padding:22px 18px 18px}
.hero .big{font-family:var(--display);font-weight:600;font-size:72px;line-height:1;margin:6px 0 4px}
.hero .big small{font-size:32px;font-weight:500;margin-left:4px}
.flower-pick{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:12px;background:var(--fill);margin-top:8px}
.flower-pick .sv{font-weight:600}
.flower-pick .bot{font-size:15px;color:var(--muted)}
.flower-pick .chg{font-size:13px;color:var(--green);font-weight:500}
/* ladder */
.ladder{display:grid;gap:0;margin-top:14px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.dot{width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--muted);position:relative;z-index:1}
.step.final .dot{background:var(--green);border-color:var(--green);color:var(--card)}
.step .body{background:var(--card);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.step .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step .title{font-weight:600}
.step .val{font-weight:600;font-size:18px;white-space:nowrap}
.step .delta{font-size:14px;color:var(--muted);white-space:nowrap}
.step.final .body{background:var(--green-soft)}
.step.final .val{font-family:var(--display);font-size:30px;color:var(--green)}
.money-in{display:flex;align-items:center;gap:8px}
.money-in input{font-size:22px;font-weight:600;text-align:right;width:120px;padding:8px 12px}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:12px}
.stepper button{width:40px;height:40px;font-size:22px;line-height:1;border-radius:12px;color:var(--green);font-weight:500}
.stepper button:active{background:var(--line)}
.stepper .v{min-width:44px;text-align:center;font-weight:600}
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prof button{padding:10px 6px;border-radius:12px;background:var(--fill);font-size:14px;font-weight:500;display:grid;gap:3px;justify-items:center;border:2px solid transparent}
.prof button .d{width:10px;height:10px;border-radius:50%}
.prof button[aria-pressed="true"]{background:var(--card);border-color:currentColor}
.pT{color:var(--green)} .pJ{color:var(--amber)} .pK{color:var(--rose)}
.bgT{background:var(--green)} .bgJ{background:var(--amber)} .bgK{background:var(--rose)}
.why{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.bar100{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar100 span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.link{color:var(--green);font-weight:500;font-size:14px}
.adv{display:grid;gap:10px;padding-top:4px}
.adv .row{font-size:15px}
/* bukett */
.brow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .main{flex:1;min-width:0;text-align:left}
.brow .main .sv{font-weight:600;display:flex;align-items:center;gap:7px}
.brow .main .sv i{width:9px;height:9px;border-radius:50%;flex:none}
.brow .main .sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .stepper button{width:32px;height:36px;font-size:20px}
.brow .stepper .v{min-width:26px}
.brow .main .sv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow{gap:8px}
.brow .sum{font-weight:600;min-width:58px;text-align:right}
.addbtn{width:100%;padding:14px;border-radius:14px;border:2px dashed var(--line);color:var(--green);font-weight:600;margin-top:10px}
.tot{display:grid;gap:10px}
.tot .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot .big{font-family:var(--display);font-size:44px;font-weight:600;line-height:1}
input[type=range]{padding:0;background:transparent;accent-color:var(--green);height:28px}
.sentence{font-size:15px;line-height:1.5}
.sentence b{font-weight:600}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--green);color:var(--card);font-weight:600;text-align:center}
.btn.soft{background:var(--fill);color:var(--ink)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* library */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);font-size:14px;font-weight:500;border:1px solid var(--line)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:grid;gap:8px;margin-top:8px}
.lcard{background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:3px;width:100%}
.lcard .sv{font-weight:600;display:flex;align-items:center;gap:8px}
.lcard .sv i{width:9px;height:9px;border-radius:50%}
.lcard .bot{color:var(--ink)}
.lcard .fam{font-size:13px;color:var(--muted)}
.lcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lcard .pr{font-size:14px;color:var(--muted);white-space:nowrap}
.lcard .pr b{color:var(--ink);font-weight:600}
.rbar{display:grid;gap:4px;margin-top:2px}
.rbar .track{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--green-soft),var(--amber-soft),var(--rose-soft))}
.rbar .mid,.rbar .own{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card)}
.rbar .mid{background:var(--muted)}
.rbar .own{background:var(--green);width:16px;height:16px}
.rbar .rl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.rbar .rl b{color:var(--ink);font-weight:600}
.season{font-size:13px;font-weight:500;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:7px 10px}
.tag-ref{font-size:12px;font-weight:500;color:var(--muted);background:var(--fill);border-radius:6px;padding:1px 6px;margin-left:4px}
.count{font-size:13px;color:var(--muted);margin-top:8px}
/* quiz */
.qcard{background:var(--card);border-radius:24px;padding:30px 20px;text-align:center;display:grid;gap:10px}
.qcard .ask{font-size:30px;font-weight:600;line-height:1.15}
.qcard .ask.latin{font-family:var(--display);font-style:italic;font-weight:500;font-size:34px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{background:var(--card);border-radius:14px;padding:15px 16px;text-align:left;font-size:17px;border:2px solid transparent}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.score{display:flex;justify-content:center;gap:18px;font-size:14px;color:var(--muted);margin-top:10px}
.seg3{grid-template-columns:repeat(3,1fr)}
.scope{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:500;margin-bottom:12px}
.qmeta{display:flex;justify-content:center}
.qtype{font-size:12px;color:var(--faint)}
.qcard .ask.small{font-size:22px}
.qcard .blank{color:var(--faint);letter-spacing:.1em}
.qwhy{font-size:13px;color:var(--green);margin-top:4px}
.qtype{display:none}
.qimg{margin:4px 0 0;display:grid;gap:4px}
.qimg img{width:100%;max-height:300px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--fill);display:block}
.qimg figcaption{font-size:11px;color:var(--faint);text-align:left;overflow-wrap:anywhere}
.qimg figcaption a{color:inherit}
.write{display:grid;gap:8px;margin-top:14px}
.write input{font-size:20px;padding:14px 16px;background:var(--card)}
.fb{margin-top:12px;display:grid;gap:8px}
.fbh{font-weight:600;font-size:18px}
.fbh.ok{color:var(--green)} .fbh.no{color:var(--rose)}
.fbn{font-size:17px}
.pick-list button[aria-pressed="true"]{background:var(--green-soft)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--green);font-weight:700;flex:none}
button[aria-pressed="true"] .check{border-color:var(--green);background:var(--card)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{display:grid;justify-items:center;gap:2px;padding:6px;font-size:11px;font-weight:500;color:var(--faint)}
.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar button[aria-selected="true"]{color:var(--green)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,12,9,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0 0 4px;line-height:1.1}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.pick-list{display:grid;gap:2px;margin-top:10px}
.pick-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 10px;border-radius:12px}
.pick-list button:active,.pick-list button:hover{background:var(--card)}
.field{display:grid;gap:5px;font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:14px;font-size:14px}
.banner button{flex:none;background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;color:var(--green)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="backup-banner" hidden><span id="backup-txt">Du har ändringar som inte är säkerhetskopierade.</span><button id="backup-go">Exportera</button></div>
  <!-- KALKYL -->
  <section id="v-kalkyl">
    <div class="topbar">
      <h1>Kalkyl</h1>
      <button class="icon-btn" id="btn-settings" aria-label="Inställningar"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Läge">
      <button id="m-en" aria-pressed="true">En blomma</button>
      <button id="m-bukett" aria-pressed="false">Bukett</button>
    </div>

    <div id="mode-en">
      <div class="card hero">
        <div class="label">Styckpris</div>
        <div class="big num" id="h-price">0<small>kr</small></div>
        <button class="flower-pick" id="h-pick"><span class="sv" id="h-sv"></span><span class="bot" id="h-bot"></span><span class="chg">Byt blomma</span></button>
      </div>
      <div class="ladder">
        <div class="step"><div class="dot">1</div><div class="body">
          <div class="row"><span class="title">Inpris</span>
            <span class="money-in"><input id="in-inpris" inputmode="decimal" placeholder="0,00" aria-label="Inpris i kronor"><span>kr</span></span></div>
          <div class="stack" id="in-hint" style="gap:8px;font-size:14px;color:var(--muted)"></div>
        </div></div>
        <div id="ladder"></div>
      </div>
    </div>

    <div id="mode-bukett" hidden>
      <div class="card">
        <input id="b-name" aria-label="Buketten namn" style="font-weight:600;font-size:18px;background:transparent;padding:0 0 8px">
        <div id="b-rows"></div>
        <button class="addbtn" id="b-add">+ Lägg till blomma</button>
      </div>
      <div class="card tot" style="margin-top:12px">
        <div class="row"><span class="hint">Blommor och material</span><span class="num" id="t-mat"></span></div>
        <div class="row"><span class="hint">Arbete <b id="t-apct"></b></span><span class="num" id="t-arb"></span></div>
        <input type="range" id="t-arange" min="10" max="20" step="1" aria-label="Arbetskostnad i procent">
        <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><span class="label">Pris till kund</span><span class="big num" id="t-tot"></span></div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="label" style="margin-bottom:8px">Går det runt?</div>
        <p class="sentence" id="t-sent" style="margin:0"></p>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn soft" id="b-saved">Mina buketter</button>
        <button class="btn" id="b-save">Spara</button>
      </div>
    </div>
  </section>

  <!-- BIBLIOTEK -->
  <section id="v-bibliotek" hidden>
    <div class="topbar">
      <h1>Bibliotek</h1>
      <button class="icon-btn" id="btn-new" aria-label="Ny blomma"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="search">
      <input id="lib-q" placeholder="Sök svenskt eller latinskt namn" autocomplete="off">
      <div class="chips" id="lib-chips" style="margin-top:10px">
        <button aria-pressed="true" data-f="">Alla</button>
        <button aria-pressed="false" data-f="T">Håller sig</button>
        <button aria-pressed="false" data-f="J">Normal</button>
        <button aria-pressed="false" data-f="K">Känslig</button>
        <button aria-pressed="false" data-f="egen">Mina</button>
      </div>
    </div>
    <div class="lib" id="lib"></div>
    <div class="count" id="lib-count"></div>
  </section>

  <!-- FÖRHÖR -->
  <section id="v-forhor" hidden>
    <div class="topbar"><h1>Förhör</h1>
      <button class="icon-btn" id="q-prog" aria-label="Framsteg"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    </div>
    <div class="seg seg3" role="group" aria-label="Nivå" id="q-level">
      <button data-l="easy" aria-pressed="true">Lätt</button>
      <button data-l="hard" aria-pressed="false">Svår</button>
      <button data-l="write" aria-pressed="false">Skriv</button>
    </div>
    <button class="scope" id="q-scope">Alla blommor</button>
    <div class="qcard">
      <div class="qmeta"><span class="label" id="q-lbl"></span><span class="qtype" id="q-type"></span></div>
      <div id="q-media"></div>
      <div class="ask" id="q-ask"></div>
      <div class="hint" id="q-extra"></div>
      <div class="qwhy" id="q-why"></div>
    </div>
    <div class="opts" id="q-opts"></div>
    <div class="write" id="q-write" hidden>
      <input id="q-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ditt svar">
      <div class="btnrow"><button class="btn soft" id="q-skip">Vet inte</button><button class="btn" id="q-submit">Svara</button></div>
    </div>
    <div class="card fb" id="q-fb" hidden></div>
    <button class="btn" id="q-next" style="margin-top:12px" hidden>Nästa</button>
    <div class="score"><span>Rätt <b id="q-r">0</b></span><span>Fel <b id="q-w">0</b></span><span>I rad <b id="q-s">0</b></span></div>
  </section>
</div>

<nav class="tabbar"><div class="in" role="tablist">
  <button role="tab" data-tab="kalkyl" aria-selected="true"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>Kalkyl</button>
  <button role="tab" data-tab="bibliotek" aria-selected="false"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11c0-4 2.5-7 6-7 0 4-2.5 7-6 7z"/><path d="M12 14c0-3-2-5.5-5.5-5.5 0 3 2 5.5 5.5 5.5z"/></svg>Bibliotek</button>
  <button role="tab" data-tab="forhor" aria-selected="false"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9.5 10a2.5 2.5 0 1 1 3 2.4c-.5.1-.5.6-.5 1.1M12 16h.01"/></svg>Förhör</button>
</div></nav>

<div class="sheet-bg" id="sheet-bg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

  return `<span class="lat">${esc(f.genus)}</span>${s}${f.cv?` <span class="cv">'${esc(f.cv)}'</span>`:""}`;
}

function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){if(!storeWarned){storeWarned=true;setTimeout(()=>toast("Webbläsaren sparar inte – exportera för att inte förlora data"),50);}return false;}}

let S=Object.assign({tab:"kalkyl",mode:"en",fid:"montbretia",faktor:3,moms:25,arbete:20,round:5,start:false,fast:25000,
  bukett:{name:"Rund dekoration",rows:[{fid:"montbretia",antal:4},{fid:"daucus",antal:2},{fid:"germini",antal:3},{fid:"fackellilja",antal:3},{fid:"skrappa",antal:2},{fid:"kruka",antal:1},{fid:"fiberforal",antal:1}]}},load("bk2")||{});
S.bukett.rows.forEach(r=>r.antal=Math.max(1,Math.round(r.antal)));
const save=()=>store("bk2",S);

/* effective rea/svinn with "första tiden" */
function eff(f){
  if(f.acc)return {rea:0,niva:0,svinn:0};
  let rea=f.rea,svinn=f.svinn;
  if(S.start){rea=Math.min(80,Math.round(rea*1.5));svinn=Math.min(60,Math.round(svinn*1.5));}
  return {rea,niva:f.niva,svinn};
}
function calc(f){
  const base=priceOf(f), fak=base*S.faktor, moms=fak*S.moms/100, inkl=fak+moms;
  const e=eff(f), loss=Math.min(.9,(e.rea/100)*(e.niva/100)+e.svinn/100);
  const vag=inkl/(1-loss), add=vag-inkl;
  const pris=base>0?Math.max(S.round,Math.round(vag/S.round)*S.round):0;
  return {base,fak,moms,inkl,e,loss,vag,add,pris};
}

/* ---------- En blomma ---------- */
let showAdv=false;

    <div class="hint">Påslaget ska täcka din tid, lokalen och ge vinst.</div>
  </div></div>

  <div class="step"><div class="dot">3</div><div class="body">
    <div class="row"><span class="title">+ Moms ${S.moms} %</span><span class="val num">${kr(c.inkl,2)} kr</span></div>
    <div class="row"><span class="delta">+ ${kr(c.moms,2)} kr</span></div>
    <div class="hint">Momsen går till staten, inte till dig. I skolmallen tar ni moms före faktorn. Det blir samma pris, eftersom det bara är multiplikation.</div>
  </div></div>

  <div class="step"><div class="dot">4</div><div class="body">
    <div class="row"><span class="title">+ Rea och svinn</span><span class="val num">${kr(c.vag,2)} kr</span></div>
    ${f.acc?`<div class="hint">Tillbehör vissnar inte, så här blir det inget påslag.</div>`:`
    <div class="row"><span class="delta">+ ${kr(c.add,2)} kr (+${kr(upPct,0)} %)</span></div>
    <div class="prof" role="group" aria-label="Hur blomman klarar sig">
      ${["T","J","K"].map(p=>`<button class="p${p}" data-prof="${p}" aria-pressed="${f.prof===p}"><span class="d bg${p}"></span>${PROF[p].label}</button>`).join("")}
    </div>
    <div class="why">
      <div><b>Varför?</b> Allt säljs inte till fullpris. Av 100 stjälkar:</div>
      <div class="bar100" aria-hidden="true"><span class="bgT" style="width:${full}%"></span><span class="bgJ" style="width:${e.rea}%"></span><span class="bgK" style="width:${e.svinn}%"></span></div>
      <div class="legend"><span><i class="bgT"></i>${full} fullpris</span><span><i class="bgJ"></i>${e.rea} på rea −${e.niva} %</span><span><i class="bgK"></i>${e.svinn} slängs</span></div>
      <div>För att ändå få in lika mycket som om allt såldes till fullpris behöver priset höjas med <b>${kr(upPct,0)} %</b>.</div>
    </div>
    <div class="toggle"><span>Första tiden i butiken<br><span class="hint">Mer svinn än man tror innan hjulen snurrar</span></span><button class="switch" role="switch" id="sw-start" aria-checked="${S.start}" aria-label="Första tiden"></button></div>
    <button class="link" id="adv-t" style="text-align:left">${showAdv?"Dölj":"Justera själv"}</button>
    <div class="adv" ${showAdv?"":"hidden"}>
      ${[["rea","Andel som reas","%"],["niva","Rea-nivå (13–40)","%"],["svinn","Svinn","%"]].map(([k,l])=>`<div class="row"><span>${l}</span><span class="stepper"><button data-adv="${k}" data-d="-1" aria-label="Minska">−</button><span class="v num">${f[k]} %</span><button data-adv="${k}" data-d="1" aria-label="Öka">+</button></span></div>`).join("")}
      ${S.start?`<div class="hint">Med "första tiden" påslaget räknas ${e.rea} % rea och ${e.svinn} % svinn.</div>`:""}
    </div>`}
  </div></div>

  <div class="step final"><div class="dot">✓</div><div class="body">
    <div class="row"><span class="title">Pris</span><span class="val num">${kr(c.pris)} kr</span></div>
    <div class="hint">Avrundat till närmaste ${S.round===1?"krona":S.round+" kr"}.</div>
    <button class="btn soft" id="to-bukett">Lägg i bukett</button>
  </div></div>`;
}
const parseKr=v=>Math.round((parseFloat(String(v).replace(",","."))||0)*100)/100;

$("#ladder").addEventListener("click",e=>{

  const fk=e.target.closest("[data-fak]"); if(fk){S.faktor=Math.min(4,Math.max(2.5,Math.round((S.faktor+0.1*+fk.dataset.fak)*10)/10));save();renderEn();return;}

  if(e.target.closest("#sw-start")){S.start=!S.start;save();renderEn();return;}

});

/* ---------- Bukett ---------- */
function addToBukett(id){const r=S.bukett.rows.find(r=>r.fid===id); if(r)r.antal++; else S.bukett.rows.push({fid:id,antal:1}); save(); setMode("bukett");
  const f=getF(id); if(f&&!priceOf(f)) askInpris(id); else toast("Tillagd i buketten");}
function askInpris(id){
  const f=getF(id);
  openSheet(`<div class="head"><div><h2>${esc(f.sv)}</h2><div>${botan(f)}</div></div><button class="link" data-close>Senare</button></div>
  <div class="stack"><div class="card stack">
    <div class="label">Vad kostar den per styck?</div>
    <div class="money-in" style="justify-content:center"><input id="ask-v" inputmode="decimal" placeholder="0,00" value="${f.inpris?String(f.inpris).replace(".",","):""}" style="width:160px;font-size:28px"><span>kr</span></div>
    <div class="hint" style="text-align:center">Inpris utan moms. Blir <b id="ask-p">0 kr</b> per styck i butiken.</div>
  </div><button class="btn" id="ask-ok">Spara</button></div>`);
  const upd=()=>{const c=calc({...getF(id),inpris:parseKr($("#ask-v").value)});$("#ask-p").textContent=kr(c.pris)+" kr";};
  $("#ask-v").addEventListener("input",upd); upd();
  $("#ask-ok").addEventListener("click",async()=>{await setFlower(id,{inpris:parseKr($("#ask-v").value)});closeSheet();renderBukett();});
  setTimeout(()=>$("#ask-v").focus(),60);
}
function bukettCalc(){
  let mat=0,kost=0;const rows=S.bukett.rows.map(r=>{const f=getF(r.fid);if(!f)return null;const c=calc(f);mat+=c.pris*r.antal;kost+=c.base*r.antal;return {r,f,c};}).filter(Boolean);
  const arb=mat*S.arbete/100, tot=Math.round(mat+arb), exm=tot/(1+S.moms/100), kvar=exm-kost;
  return {rows,mat,arb,tot,exm,kost,kvar};
}
function renderBukett(){
  $("#b-name").value=S.bukett.name;
  const b=bukettCalc();
  $("#b-rows").innerHTML=b.rows.length?b.rows.map(({r,f,c},i)=>`<div class="brow">
    <button class="main" data-open="${esc(f.id)}"><div class="sv"><i class="bg${f.prof}"></i><span>${esc(f.sv)}</span></div><div class="sub">${c.base?kr(c.pris)+" kr/st"+(usesRef(f)?'<span class="tag-ref">riktpris</span>':"")+(refOf(f)?.season?'<span class="tag-ref" style="color:var(--amber)">säsong</span>':""):"<span style='color:var(--rose);font-weight:500'>Fyll i inpris</span>"}</div></button>
    <span class="stepper"><button data-q="${i}" data-d="-1" aria-label="En färre">−</button><span class="v num">${r.antal}</span><button data-q="${i}" data-d="1" aria-label="En till">+</button></span>
    <span class="sum num">${kr(c.pris*r.antal)} kr</span></div>`).join(""):`<p class="hint" style="margin:10px 0">Tom bukett. Lägg till en blomma.</p>`;
  $("#t-mat").textContent=kr(b.mat)+" kr";
  $("#t-apct").textContent=S.arbete+" %";
  $("#t-arb").textContent=kr(b.arb)+" kr";
  $("#t-arange").value=S.arbete;
  $("#t-tot").textContent=kr(b.tot)+" kr";
  const be=b.kvar>0?Math.ceil(S.fast/b.kvar):null;
  $("#t-sent").innerHTML=b.rows.length?`Blommorna kostar dig <b>${kr(b.kost)} kr</b>. Kunden betalar <b>${kr(b.tot)} kr</b>, varav <b>${kr(b.tot-b.exm)} kr</b> är moms. Kvar till lokal, lön och vinst: <b>${kr(b.kvar)} kr</b>.`+(be?` Med ${kr(S.fast)} kr i fasta kostnader per månad behöver du sälja <b>${be} sådana</b> i månaden för att gå jämnt.`:""):"Lägg till blommor så räknar vi.";
  const nref=b.rows.filter(x=>usesRef(x.f)).length;
  if(nref) $("#t-sent").innerHTML+=`<span class="hint" style="display:block;margin-top:8px">${nref} av ${b.rows.length} blommor räknas med riktpris.</span>`;
}

  const o=e.target.closest("[data-open]"); if(o){const f=getF(o.dataset.open); if(f&&!priceOf(f)){askInpris(f.id);return;} S.fid=o.dataset.open;save();setMode("en");}

  openSheet(`<div class="head"><div><h2>${esc(f.sv)}</h2><div style="font-size:18px">${botan(f)}</div></div><button class="link" data-close>Stäng</button></div>

const APPKEY="sofias-blomkalkyl";
function exportData(){
  return {app:APPKEY,version:1,exported:new Date().toISOString(),

function fileName(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `blomkalkyl-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;}
function markExported(){store("bk2-exported",Date.now());updateBanner();}
async function doExport(){
  const txt=JSON.stringify(exportData(),null,2), name=fileName();
  let file=null; try{file=new File([txt],name,{type:"application/json"});}catch(e){}
  // Mobil: dela-menyn (spara i Filer/iCloud/Drive eller mejla till sig själv). Dator: vanlig nedladdning.
  const touch=matchMedia("(pointer:coarse)").matches;
  if(touch&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Blomkalkyl – säkerhetskopia"});markExported();toast("Exporterad");return;}
    catch(e){if(e&&e.name==="AbortError")return;}
  }
  const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  markExported();toast("Filen laddas ner");
}
function readImport(txt){
  let d; try{d=JSON.parse(txt);}catch(e){throw new Error("Filen är inte giltig JSON.");}
  if(!d||d.app!==APPKEY)throw new Error("Det här är ingen säkerhetskopia från Blomkalkyl.");
  if(!d.blommor||typeof d.blommor!=="object"||!Array.isArray(d.buketter))throw new Error("Säkerhetskopian saknar delar och kan inte läsas.");
  return d;
}
function askImport(d){
  const nb=Object.keys(d.blommor).length, nk=d.buketter.length;
  const when=d.exported?new Date(d.exported).toLocaleString("sv-SE",{dateStyle:"medium",timeStyle:"short"}):"okänt datum";
  openSheet(`<div class="head"><h2>Importera</h2><button class="link" data-close>Avbryt</button></div>
  <div class="stack">
    <div class="card sentence">Säkerhetskopian från <b>${esc(when)}</b> innehåller <b>${nb}</b> egna eller ändrade blommor och <b>${nk}</b> sparade buketter.</div>
    <button class="btn" id="im-merge">Slå ihop med det jag har</button>
    <div class="hint" style="margin-top:-4px">Blommor och buketter från filen läggs till. Finns samma blomma på båda ställen vinner filen.</div>
    <button class="btn soft" id="im-replace" style="color:var(--rose)">Ersätt allt med filen</button>
    <div class="hint" style="margin-top:-4px">Allt som finns här nu tas bort och byts mot filens innehåll.</div>
  </div>`);
  const apply=mode=>{
    if(mode==="replace"){overrides=new Map(Object.entries(d.blommor));saved=d.buketter.slice();if(d.installningar&&typeof d.installningar==="object"){Object.assign(S,d.installningar);}QS=(d.forhor&&typeof d.forhor==="object")?d.forhor:{};}
    else{for(const [k,v] of Object.entries(d.blommor))overrides.set(k,v);const ids=new Set(saved.map(x=>x.id));d.buketter.forEach(b=>{if(b&&!ids.has(b.id))saved.push(b);});saved.sort((a,b)=>(b.ts||0)-(a.ts||0));if(d.forhor&&typeof d.forhor==="object")for(const [k,v] of Object.entries(d.forhor)){if(!QS[k]||(v&&v.n>QS[k].n))QS[k]=v;}}
    if(!S.bukett||!Array.isArray(S.bukett.rows))S.bukett={name:"Bukett",rows:[]};
    S.bukett.rows.forEach(r=>r.antal=Math.max(1,Math.round(r.antal)));
    store("bk2-ov",Object.fromEntries(overrides));store("bk2-saved",saved);store("bk2-quiz",QS);save();
    const now=Date.now();store("bk2-changed",now);store("bk2-exported",now);
    rebuildLib();closeSheet();rerender();updateBanner();toast(mode==="replace"?"Allt ersatt":"Ihopslaget");
  };
  $("#im-merge").addEventListener("click",()=>apply("merge"));
  let armed=false;
  $("#im-replace").addEventListener("click",e=>{if(!armed){armed=true;e.target.textContent="Tryck igen för att ersätta allt";setTimeout(()=>{armed=false;e.target.textContent="Ersätt allt med filen";},3500);return;}apply("replace");});
}
function importFile(file){
  if(!file)return;

/* ---------- säsong, högtider, torkbarhet ---------- */
const SEASON={solros:"7-9",sommaraster:"7-10",stormhatt:"6-9",stjärnflocka:"6-9",dahlia:"7-10",bolltistel:"7-10",tulpan:"12-4",pion:"5-6",ranunkel:"1-4",anemon:"11-4",
  lavendel:"6-8",fackellilja:"7-9",montbretia:"7-9",daucus:"6-9",gladiolus:"6-9",luktart:"5-8",syren:"3-5",hyacint:"12-4",narciss:"1-4",amaryllis:"11-1",julros:"12-2",
  julstjarna:"11-12",ljung:"8-10",vallmo:"12-4",scabiosa:"5-10",nigella:"6-8",zinnia:"7-9",kosmos:"7-9",rudbeckia:"7-9",rolleka:"6-9",kaarleksort:"8-10",allium:"5-7",
  agapanthus:"6-9",nerine:"9-12",klocka:"5-7",digitalis:"5-7",viburnum:"4-6",salg:"1-4",mimosa:"1-3",kungsgran:"11-12",vaxblomma:"12-4",skimmia:"10-4",lovkoja:"3-6",
  kornblomma:"6-8",prydnadskal:"9-12",veronika:"6-9",eternell:"7-9"};
const MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function seasonMonths(id){const s=SEASON[id];if(!s)return null;const [a,b]=s.split("-").map(Number);const m=[];let x=a;for(let i=0;i<12;i++){m.push(x);if(x===b)break;x=x%12+1;}return m;}
const seasonLabel=id=>{const s=SEASON[id];if(!s)return "året runt";const [a,b]=s.split("-").map(Number);return MON[a-1]+"–"+MON[b-1];};
function seasonFactor(id,month){const m=seasonMonths(id);if(!m)return 1;if(m.includes(month))return 3;const p=month===1?12:month-1,n=month%12+1;return (m.includes(p)||m.includes(n))?1.6:.5;}
const BUCKETS=[["Vinter (dec–feb)",[12,1,2]],["Vår (mar–maj)",[3,4,5]],["Sommar (jun–aug)",[6,7,8]],["Höst (sep–nov)",[9,10,11]]];
function seasonBucket(id){const m=seasonMonths(id);if(!m)return "Året runt";let best=null,bc=-1;for(const [l,ms] of BUCKETS){const c=ms.filter(x=>m.includes(x)).length;if(c>bc){bc=c;best=l;}}return best;}
const DRY=new Set(["brudslöja","stjärnflocka","bolltistel","hortensia","lavendel","eukalyptus","skrappa","nigella","protea","leucadendron","pampas","harsvans","martorn",
  "limonium","eternell","rolleka","allium","craspedia","kardvadd","ljung","salg","kornblomma","gullris","scabiosa"]);

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
  l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const firstWeekday=(y,mo,day,wd)=>{const d=new Date(y,mo,day);while(d.getDay()!==wd)d.setDate(d.getDate()+1);return d;};
const HOL=[
  {name:"alla hjärtans dag",date:y=>new Date(y,1,14),win:21,ids:["ros","tulpan","ranunkel","anemon","gerbera","germini"]},
  {name:"påsk",date:y=>easter(y),win:28,ids:["narciss","tulpan","salg","hyacint","ranunkel","anemon","mimosa"]},
  {name:"mors dag",date:y=>{const d=new Date(y,4,31);d.setDate(31-d.getDay());return d;},win:21,ids:["ros","pion","lisianthus","nejlika","alstroemeria","lovkoja"]},
  {name:"studenten",date:y=>new Date(y,5,5),win:21,ids:["ros","pion","brudslöja","lisianthus","gerbera","solros"]},
  {name:"midsommar",date:y=>firstWeekday(y,5,19,5),win:14,ids:["kornblomma","rolleka","daucus","ammi","klocka","nigella"]},
  {name:"allhelgona",date:y=>firstWeekday(y,9,31,6),win:35,ids:["krysantemum","ljung","skimmia","buxbom","kungsgran"]},
  {name:"jul",date:y=>new Date(y,11,24),win:35,ids:["amaryllis","julros","julstjarna","kungsgran","hyacint","skimmia","hypericum","eukalyptus","buxbom"]}
];
function holidays(now,maxDays){const out=[];const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(const h of HOL)for(const y of [now.getFullYear(),now.getFullYear()+1]){const d=h.date(y);const days=Math.round((d-t0)/864e5);if(days>=0&&days<=(maxDays??h.win)){out.push({...h,days,d});break;}}
  return out.sort((a,b)=>a.days-b.days);}
function holidayFor(id,now){const hs=holidays(now).filter(h=>h.ids.includes(id));return hs[0]||null;}

/* ---------- bilder från Wikimedia ---------- */
let IMG=load("bk2-img")||{}, IMG_DOWN=false;
const imgTitle=f=>{const sp=f.species||"";const ok=sp&&!/^spp?\.$/.test(sp)&&!/hybrid/i.test(sp);return ok?[f.genus+" "+sp.replace(/\s+/g," ").trim(),f.genus]:[f.genus];};
async function fetchJSON(url,ms=6000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(r.status===404)return null;if(!r.ok)throw new Error("http");return await r.json();}finally{clearTimeout(t);}}
const stripHTML=s=>{const d=document.createElement("div");d.innerHTML=s||"";return (d.textContent||"").replace(/\s+/g," ").trim();};
async function fileMeta(file){
  for(const host of ["commons.wikimedia.org","en.wikipedia.org"]){
    try{const j=await fetchJSON(`https://${host}/w/api.php?action=query&titles=${encodeURIComponent("File:"+file)}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=720&format=json&origin=*`);
      const p=Object.values(j?.query?.pages||{})[0];const ii=p&&p.imageinfo&&p.imageinfo[0];if(!ii)continue;
      const md=ii.extmetadata||{};
      return {src:ii.thumburl||ii.url,artist:stripHTML(md.Artist?.value).slice(0,70)||"okänd fotograf",license:stripHTML(md.LicenseShortName?.value)||"",page:ii.descriptionurl||`https://${host}/wiki/File:${encodeURIComponent(file)}`};
    }catch(e){}
  }
  return null;
}
const imgPending={};
function getImg(f){
  if(!f||!f.genus||f.genus==="–")return Promise.resolve(null);
  const c=IMG[f.id];
  if(c&&c.src)return Promise.resolve(c);
  if(c&&c.fail&&Date.now()-c.fail<864e5)return Promise.resolve(null);
  if(imgPending[f.id])return imgPending[f.id];
  imgPending[f.id]=(async()=>{
    let answered=false;
    for(const title of imgTitle(f)){
      try{const s=await fetchJSON("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_"))+"?redirect=true");
        answered=true;
        if(!s||s.type==="disambiguation")continue;
        const orig=s.originalimage?.source||s.thumbnail?.source;if(!orig)continue;
        let file=decodeURIComponent(orig.split("/").pop());
        if(/\/thumb\//.test(orig)){const parts=orig.split("/");file=decodeURIComponent(parts[parts.length-2]);}
        const meta=await fileMeta(file);
        const rec=meta?{...meta,wiki:s.content_urls?.desktop?.page||""}:{src:s.thumbnail?.source||orig,artist:"se Wikipedia",license:"",page:s.content_urls?.desktop?.page||"",wiki:s.content_urls?.desktop?.page||""};
        IMG[f.id]=rec;store("bk2-img",IMG);return rec;
      }catch(e){if(e&&(e.name==="TypeError"||e.name==="AbortError")){IMG_DOWN=true;setTimeout(()=>{IMG_DOWN=false;},120000);break;}}
    }
    if(answered){IMG[f.id]={fail:Date.now()};store("bk2-img",IMG);}
    return null;
  })().finally(()=>{delete imgPending[f.id];});
  return imgPending[f.id];
}
const credit=r=>`<figcaption>Foto: <a href="${esc(r.page)}" target="_blank" rel="noopener">${esc(r.artist)}</a>${r.license?" · "+esc(r.license):""} · Wikimedia Commons</figcaption>`;
const figure=r=>r?`<figure class="qimg"><img src="${esc(r.src)}" alt="" loading="lazy" referrerpolicy="no-referrer">${credit(r)}</figure>`:"";
function prefetch(n){const pool=quizPool().filter(f=>!IMG[f.id]);for(let i=0;i<n&&pool.length;i++){getImg(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}}

/* ---------- förhörsmotorn ---------- */
let QS=load("bk2-quiz")||{};
const saveQS=()=>store("bk2-quiz",QS);
const BOXW=[3,2,1.3,.8,.5];
const TYPE_NAMES={sv2lat:"svenska → latin",lat2sv:"latin → svenska",img:"bild",fam:"familj",dry:"torkbarhet",season:"säsong"};
const norm=s=>String(s||"").toLowerCase().replace(/[×'"’‘,.]/g," ").replace(/\s+/g," ").trim();
const loose=s=>norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
const validSp=sp=>sp&&!/^spp?\.$/.test(sp)&&!/hybrid/i.test(sp);
const fullLat=f=>validSp(f.species)?`${f.genus} ${f.species}`.replace(/\s+/g," "):f.genus;
const latHTML=f=>validSp(f.species)?`<span class="lat">${esc(f.genus)}</span> ${f.species.includes("×")?"× ":""}<span class="lat">${esc(f.species.replace("×","").trim())}</span>`:`<span class="lat">${esc(f.genus)}</span>${/^spp?\.$/.test(f.species)?" spp.":""}`;
const svNames=f=>f.sv.split(",").map(s=>s.trim()).filter(Boolean);
const leaky=f=>{const g=loose(f.genus);return svNames(f).some(n=>{n=loose(n);return n===g||n.startsWith(g+" ")||g.startsWith(n);});};
function quizPool(all){return LIB.filter(f=>f.genus&&f.genus!=="–"&&!f.acc&&(all||!S.useWeek||!(S.week||[]).length||(S.week||[]).includes(f.id)));}
function eligible(f,level){
  const t=[];
  if(validSp(f.species)||!leaky(f))t.push("sv2lat");
  if(!leaky(f))t.push("lat2sv");
  if(!IMG_DOWN&&!(IMG[f.id]&&IMG[f.id].fail))t.push("img");
  if(f.fam&&f.fam!=="Tillbehör")t.push("fam");
  if(level!=="write"){if(DRY.has(f.id))t.push("dry");if(SEASON[f.id])t.push("season");}
  return t;
}
const st=(id,type)=>QS[id+"|"+type];
const typeW=(id,type)=>{const s=st(id,type);return s?BOXW[s.b]:1.6;};
function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
function checkTyped(input,accepts){
  const a=norm(input);if(!a)return {res:"wrong"};
  for(const x of accepts)if(norm(x)===a)return {res:"right"};
  let best=null,bd=99;for(const x of accepts){const d=levenshtein(loose(x),loose(input));if(d<bd){bd=d;best=x;}}
  const lim=Math.max(1,Math.floor(loose(best||"").length/7));
  return bd<=lim?{res:"almost",best}:{res:"wrong"};
}
function pickWeighted(items,wf){const ws=items.map(wf);const tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function distract(f,n,key,ok,hard){
  const ans=norm(key(f));const seen=new Set([ans]);
  const cands=shuffle(quizPool(true).filter(o=>o!==f&&ok(o)));
  const tiers=hard?[cands.filter(o=>o.fam===f.fam),cands.filter(o=>loose(key(o))[0]===loose(key(f))[0]),cands]:[cands];
  const out=[];for(const tier of tiers)for(const o of tier){if(out.length>=n)break;const k=norm(key(o));if(!seen.has(k)){seen.add(k);out.push(o);}}
  return out;
}

let Q={r:0,w:0,s:0,cur:null,done:false,recent:[]};
function whyText(f,now){
  const h=holidayFor(f.id,now);
  if(h)return h.days===0?`Det är ${h.name} i dag – ${f.sv.split(",")[0].toLowerCase()} säljer mycket då.`:`${h.days} dagar till ${h.name}. ${f.sv.split(",")[0]} säljer mycket då.`;
  const sm=seasonMonths(f.id);if(sm&&sm.includes(now.getMonth()+1))return `Säsong nu (${seasonLabel(f.id)}).`;
  const ts=Object.keys(QS).filter(k=>k.startsWith(f.id+"|")).map(k=>QS[k]);
  if(ts.some(s=>s.b===0&&s.n>0))return "Du missade den senast.";
  if(!ts.length)return "Ny för dig.";
  return "Repetition.";
}
async function newQ(){
  const level=S.qlevel||"easy", now=new Date(), month=now.getMonth()+1;
  let pool=quizPool(); if(pool.length<2)pool=quizPool(true);
  const fresh=pool.filter(f=>!Q.recent.includes(f.id)); if(fresh.length>=1&&pool.length>=2)pool=fresh;
  const listMode=S.useWeek&&(S.week||[]).length>0;
  const weight=f=>{const types=eligible(f,level);const weak=Math.max(...types.map(t=>typeW(f.id,t)));const h=holidayFor(f.id,now);return (listMode?1:seasonFactor(f.id,month)*(h?2.5:1))*weak;};
  for(let attempt=0;attempt<4;attempt++){
    const f=pickWeighted(pool,weight);
    const types=eligible(f,level);
    const type=pickWeighted(types,t=>typeW(f.id,t)*(t==="img"?(IMG[f.id]&&IMG[f.id].src?1.5:.9):t==="fam"?.7:t==="season"?.8:1));
    let img=null;
    if(type==="img"){$("#q-ask").innerHTML=`<span class="hint">Hämtar bild …</span>`;img=await getImg(f);if(!img)continue;}
    Q.cur=buildQ(f,type,level,img);Q.cur.why=whyText(f,now);Q.done=false;Q.answer=null;
    Q.recent=[f.id,...Q.recent].slice(0,Math.max(1,Math.min(6,Math.floor(quizPool().length/2))));
    renderQ();prefetch(2);getImg(f);return;
  }
  const f=pickWeighted(pool,weight);Q.cur=buildQ(f,"fam",level,null);Q.cur.why=whyText(f,now);Q.done=false;renderQ();
}
function buildQ(f,type,level,img){
  const hard=level==="hard", write=level==="write"&&["sv2lat","lat2sv","img","fam"].includes(type);
  const q={f,type,write,img,accept:[],choices:null};
  const svMain=svNames(f)[0];
  if(type==="sv2lat"){
    if(leaky(f)){
      q.label="Vilket artnamn?";q.ask=`<span class="lat" style="font-size:1.15em">${esc(f.genus)}</span> <span class="blank">______</span>`;q.sub=esc(f.fam);
      q.accept=[f.species.replace("×","").trim(),fullLat(f)];
      if(!write)q.choices=[f,...distract(f,3,o=>o.species.replace("×","").trim(),o=>validSp(o.species),hard)].map(o=>({html:`<span class="lat">${esc(o.species.replace("×","").trim())}</span>`,ok:o===f}));
    }else{
      q.label="Vad heter den botaniskt?";q.ask=esc(svMain);q.sub=hard?"":esc(f.fam);
      q.accept=[fullLat(f),fullLat(f).replace("×","")];
      if(!write)q.choices=[f,...distract(f,3,fullLat,o=>true,hard)].map(o=>({html:latHTML(o),ok:o===f}));
    }
  }else if(type==="lat2sv"){
    q.label="Vad heter den på svenska?";q.ask=latHTML(f);q.askClass="latin";q.sub="";
    q.accept=svNames(f);
    if(!write)q.choices=[f,...distract(f,3,o=>svNames(o)[0],o=>!leaky(o)||true,hard)].map(o=>({html:esc(svNames(o)[0]),ok:o===f}));
  }else if(type==="img"){
    q.label="Vilken blomma är det här?";q.ask="";q.media=figure(img);q.sub="";
    q.accept=[...svNames(f),fullLat(f),f.genus];
    if(!write)q.choices=[f,...distract(f,3,o=>svNames(o)[0],o=>true,hard)].map(o=>({html:esc(svNames(o)[0])+(hard?"":` <span class="hint">· ${latHTML(o)}</span>`),ok:o===f}));
  }else if(type==="fam"){
    q.label="Vilken familj?";q.ask=esc(svMain);q.sub=latHTML(f);
    q.accept=[f.fam];
    if(!write){const fams=shuffle([...new Set(quizPool(true).map(o=>o.fam).filter(x=>x&&x!==f.fam&&x!=="Tillbehör"))]).slice(0,3);
      q.choices=shuffle([f.fam,...fams]).map(x=>({html:esc(x),ok:x===f.fam}));}
  }else if(type==="dry"){
    q.label="Torka och eterneller";q.ask="Vilken av dessa torkar bäst?";q.askClass="small";q.sub="Behåller form och färg – bra till torkbinderi";
    const others=shuffle(quizPool(true).filter(o=>!DRY.has(o.id)&&o.prof!=="T")).slice(0,3);
    q.choices=shuffle([f,...others]).map(o=>({html:esc(svNames(o)[0])+` <span class="hint">· ${latHTML(o)}</span>`,ok:o===f}));
  }else if(type==="season"){
    q.label="Säsong";q.ask=`När har ${esc(svMain.toLowerCase())} säsong?`;q.askClass="small";q.sub=latHTML(f);
    const ans=seasonBucket(f.id);const opts=shuffle([...BUCKETS.map(b=>b[0]),"Året runt"].filter(x=>x!==ans)).slice(0,3);
    q.choices=shuffle([ans,...opts]).map(x=>({html:esc(x),ok:x===ans}));
  }
  if(q.choices)q.choices=shuffle(q.choices);
  return q;
}
function renderQ(){
  const q=Q.cur,f=q.f;
  $("#q-lbl").textContent=q.label;
  $("#q-media").innerHTML=q.media||"";
  $("#q-ask").className="ask"+(q.askClass?" "+q.askClass:"");
  $("#q-ask").innerHTML=q.ask;
  $("#q-extra").innerHTML=q.sub||"";
  $("#q-why").textContent=q.why||"";
  $("#q-type").textContent=TYPE_NAMES[q.type];
  if(q.choices){
    $("#q-write").hidden=true;$("#q-opts").hidden=false;
    $("#q-opts").innerHTML=q.choices.map((c,i)=>{let cls="opt";if(Q.done){if(c.ok)cls+=" right";else if(i===Q.answer)cls+=" wrong";}return `<button class="${cls}" data-o="${i}" ${Q.done?"disabled":""}>${c.html}</button>`;}).join("");
  }else{
    $("#q-opts").hidden=true;$("#q-write").hidden=false;
    const inp=$("#q-in");inp.disabled=Q.done;if(!Q.done){inp.value="";inp.placeholder=q.type==="fam"?"t.ex. Asteraceae":q.type==="lat2sv"?"svenskt namn":q.type==="img"?"svenskt eller latinskt namn":"släkte och art";setTimeout(()=>inp.focus({preventScroll:true}),30);}
    $("#q-submit").hidden=Q.done;$("#q-skip").hidden=Q.done;
  }
  const fb=$("#q-fb");
  if(Q.done){
    const r=Q.result;
    const head=r.res==="right"?`<div class="fbh ok">Rätt!</div>`:r.res==="almost"?`<div class="fbh ok">Nästan rätt – stavas <b>${esc(r.best)}</b></div>`:`<div class="fbh no">Inte riktigt${q.write&&r.typed?` – du skrev ”${esc(r.typed)}”`:""}</div>`;
    const img=IMG[f.id]&&IMG[f.id].src&&q.type!=="img"?figure(IMG[f.id]):"";
    let extra="";
    if(q.type==="season")extra=`<div>Säsong: <b>${seasonLabel(f.id)}</b>.${refOf(f)&&refOf(f).note?" "+esc(refOf(f).note):""}</div>`;
    if(q.type==="dry")extra=`<div>${esc(svNames(f)[0])} går att torka och behåller formen. Häng den upp och ner, mörkt och luftigt.</div>`;
    fb.innerHTML=`${head}<div class="fbn"><b>${esc(f.sv)}</b> · ${botan(f)}</div><div class="hint">${esc(f.fam)} · säsong ${seasonLabel(f.id)}${DRY.has(f.id)?" · torkbar":""}</div>${extra}${img}${f.cur?`<div class="sentence">${esc(f.cur)}</div>`:""}`;
    fb.hidden=false;
  }else fb.hidden=true;
  $("#q-next").hidden=!Q.done;
  $("#q-r").textContent=Q.r;$("#q-w").textContent=Q.w;$("#q-s").textContent=Q.s;
  $("#q-scope").innerHTML=S.useWeek&&(S.week||[]).length?`Min lista · ${(S.week||[]).length} st <span aria-hidden="true">›</span>`:`Alla blommor · ${quizPool(true).length} st <span aria-hidden="true">›</span>`;
}
function answer(res,extra){
  const q=Q.cur,key=q.f.id+"|"+q.type,s=QS[key]||{b:0,n:0,r:0};
  const ok=res!=="wrong";s.n++;if(ok){s.r++;s.b=Math.min(4,s.b+1);Q.r++;Q.s++;}else{s.b=0;Q.w++;Q.s=0;}s.t=Date.now();QS[key]=s;saveQS();
  Q.done=true;Q.result={res,...extra};renderQ();
  setTimeout(()=>$("#q-fb").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"}),40);
  if(Q.s===10&&S.qlevel==="easy")toast("Tio rätt i rad – testa Svår?");
}
$("#q-opts").addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b||Q.done)return;Q.answer=+b.dataset.o;answer(Q.cur.choices[Q.answer].ok?"right":"wrong");});
function submitTyped(){if(Q.done)return;const v=$("#q-in").value;if(!v.trim()){toast("Skriv ett svar eller tryck Vet inte");return;}const r=checkTyped(v,Q.cur.accept);answer(r.res,{best:r.best,typed:v});}
$("#q-submit").addEventListener("click",submitTyped);
$("#q-in").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitTyped();}});
$("#q-skip").addEventListener("click",()=>answer("wrong",{typed:""}));
$("#q-next").addEventListener("click",()=>{newQ();window.scrollTo({top:0});});
document.querySelectorAll("#q-level button").forEach(b=>b.addEventListener("click",()=>{S.qlevel=b.dataset.l;save();document.querySelectorAll("#q-level button").forEach(x=>x.setAttribute("aria-pressed",x===b));newQ();}));

/* urval / veckans lista */
$("#q-scope").addEventListener("click",()=>{
  let sel=new Set(S.week||[]);
  openSheet(`<div class="head"><h2>Urval</h2><button class="link" data-close>Klar</button></div>
  <div class="seg" role="group"><button id="ws-all" aria-pressed="${!S.useWeek}">Alla blommor</button><button id="ws-list" aria-pressed="${!!S.useWeek}">Min lista</button></div>
  <p class="hint" style="margin:0 0 10px">Bocka i veckans blommor från skolan. Förhöret kör då bara dem, med extra tyngd på dem du missar.</p>
  <input id="ws-q" placeholder="Sök" autocomplete="off">
  <div class="hint" id="ws-n" style="margin:8px 0"></div>
  <div class="pick-list" id="ws-l"></div>
  <button class="btn soft" id="ws-clear" style="margin-top:10px">Töm listan</button>`);
  const draw=()=>{const q=$("#ws-q").value.trim();$("#ws-n").textContent=`${sel.size} valda`;
    $("#ws-l").innerHTML=quizPool(true).filter(f=>!q||matches(f,q)).map(f=>`<button data-w="${esc(f.id)}" aria-pressed="${sel.has(f.id)}"><span><b>${esc(f.sv)}</b><br><span class="hint">${botan(f)}</span></span><span class="check">${sel.has(f.id)?"✓":""}</span></button>`).join("");};
  const commit=()=>{S.week=[...sel];if(!sel.size)S.useWeek=false;save();};
  draw();
  $("#ws-q").addEventListener("input",draw);
  $("#ws-l").addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b)return;const id=b.dataset.w;sel.has(id)?sel.delete(id):sel.add(id);if(sel.size)S.useWeek=true;commit();$("#ws-all").setAttribute("aria-pressed",!S.useWeek);$("#ws-list").setAttribute("aria-pressed",!!S.useWeek);draw();});
  $("#ws-all").addEventListener("click",()=>{S.useWeek=false;save();$("#ws-all").setAttribute("aria-pressed",true);$("#ws-list").setAttribute("aria-pressed",false);});
  $("#ws-list").addEventListener("click",()=>{if(!sel.size){toast("Bocka i blommor först");return;}S.useWeek=true;save();$("#ws-all").setAttribute("aria-pressed",false);$("#ws-list").setAttribute("aria-pressed",true);});
  $("#ws-clear").addEventListener("click",()=>{sel=new Set();commit();draw();$("#ws-all").setAttribute("aria-pressed",true);$("#ws-list").setAttribute("aria-pressed",false);});
});
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")&&S.tab==="forhor"&&Q.cur&&!Q.done){const pool=quizPool();if(!pool.includes(Q.cur.f))newQ();else renderQ();}});

/* framsteg */
$("#q-prog").addEventListener("click",()=>{
  const now=new Date(),pool=quizPool(true);
  const avg=f=>{const ks=Object.keys(QS).filter(k=>k.startsWith(f.id+"|"));if(!ks.length)return null;return ks.reduce((a,k)=>a+QS[k].b,0)/ks.length;};
  const seen=pool.filter(f=>avg(f)!==null), master=seen.filter(f=>avg(f)>=3);
  const weak=seen.filter(f=>avg(f)<2).sort((a,b)=>avg(a)-avg(b)).slice(0,6);
  const hs=holidays(now,60);
  const inSeason=pool.filter(f=>{const m=seasonMonths(f.id);return m&&m.includes(now.getMonth()+1);});
  const byType=Object.keys(TYPE_NAMES).map(t=>{const ks=Object.keys(QS).filter(k=>k.endsWith("|"+t));const n=ks.reduce((a,k)=>a+QS[k].n,0),r=ks.reduce((a,k)=>a+QS[k].r,0);return {t,n,r};}).filter(x=>x.n);
  openSheet(`<div class="head"><h2>Framsteg</h2><button class="link" data-close>Klar</button></div>
  <div class="stack">
    <div class="card stack" style="gap:8px"><div class="label">Behärskar</div>
      <div class="sentence"><b>${master.length}</b> av ${pool.length} blommor sitter säkert. Du har övat på ${seen.length}.</div>
      <div class="bar100"><span class="bgT" style="width:${pool.length?master.length/pool.length*100:0}%"></span><span class="bgJ" style="width:${pool.length?(seen.length-master.length)/pool.length*100:0}%"></span></div>
      ${byType.length?`<div class="hint">${byType.map(x=>`${TYPE_NAMES[x.t]} ${Math.round(x.r/x.n*100)} %`).join(" · ")}</div>`:""}
    </div>
    ${weak.length?`<div class="card stack" style="gap:6px"><div class="label">Öva mer på</div>${weak.map(f=>`<div><b>${esc(f.sv)}</b> · ${botan(f)}</div>`).join("")}</div>`:""}
    <div class="card stack" style="gap:6px"><div class="label">Aktuellt i butiken</div>
      ${hs.length?hs.map(h=>`<div><b>${h.days===0?"I dag":h.days+" dagar"}</b> till ${h.name}: ${h.ids.map(id=>getF(id)).filter(Boolean).map(f=>esc(svNames(f)[0].toLowerCase())).join(", ")}</div>`).join(""):`<div class="hint">Ingen högtid de närmaste 60 dagarna.</div>`}
      ${inSeason.length?`<div><b>Säsong nu:</b> ${inSeason.map(f=>esc(svNames(f)[0].toLowerCase())).join(", ")}</div>`:""}
    </div>
    <button class="btn soft" id="pr-reset" style="color:var(--rose)">Nollställ förhöret</button>
  </div>`);
  let armed=false;$("#pr-reset").addEventListener("click",e=>{if(!armed){armed=true;e.target.textContent="Tryck igen för att nollställa";setTimeout(()=>{armed=false;e.target.textContent="Nollställ förhöret";},3000);return;}QS={};saveQS();Q.r=Q.w=Q.s=0;closeSheet();newQ();toast("Nollställt");});
});

/* ---------- tabs ---------- */
function switchTab(t){S.tab=t;save();document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["kalkyl","bibliotek","forhor"].forEach(v=>$("#v-"+v).hidden=v!==t);
  if(t==="kalkyl")setMode(S.mode);if(t==="bibliotek")renderLib();if(t==="forhor"){document.querySelectorAll("#q-level button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===(S.qlevel||"easy")));if(!Q.cur)newQ();else renderQ();}window.scrollTo(0,0);}
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
function rerender(){if(S.tab==="kalkyl")S.mode==="en"?renderEn():renderBukett();if(S.tab==="bibliotek")renderLib();}

updateBanner();
